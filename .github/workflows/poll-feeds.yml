name: Poll RSS feeds

# 배포된 앱의 /api/cron/poll을 주기적으로 호출해 새 글을 수집 (ADR-0006).
# 필요 설정:
#   - Variables → DEVGIST_APP_URL : 배포 베이스 URL (예: https://devgist.vercel.app)
#   - Secrets   → CRON_SECRET     : 앱의 CRON_SECRET과 동일 값
on:
  schedule:
    # 매일 08:00·18:00 KST = 23:00·09:00 UTC (GitHub Actions cron은 UTC 기준).
    # Actions cron은 정시 보장 X, 수 분 지연 가능(ADR-0006 — 수집은 지연 관대).
    - cron: '0 23 * * *' # 08:00 KST
    - cron: '0 9 * * *' # 18:00 KST
  workflow_dispatch: # Actions 탭에서 수동 트리거

# 이전 폴링 진행 중이면 대기 (중복 호출 방지)
concurrency:
  group: poll-feeds
  cancel-in-progress: false

jobs:
  poll:
    name: Trigger feed poll
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/poll
        env:
          APP_URL: ${{ vars.DEVGIST_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$APP_URL" || -z "$CRON_SECRET" ]]; then
            echo "::error::DEVGIST_APP_URL(variable) 또는 CRON_SECRET(secret) 미설정"
            exit 1
          fi
          APP_URL="${APP_URL%/}" # 끝 슬래시 제거 ("//api/..." → 308 리다이렉트 방지)
          echo "POST ${APP_URL}/api/cron/poll"
          # -L: 혹시 모를 리다이렉트 추적(같은 호스트라 Authorization 유지), -f: 4xx/5xx면 실패 처리
          curl -fsSL -X POST "${APP_URL}/api/cron/poll" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -w "\nHTTP %{http_code}\n"
